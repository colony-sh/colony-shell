[package]
name = "colony-secure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Secure environment variable protection for Colony Shell"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.8"
thiserror.workspace = true
sha2 = "0.10"
hex = "0.4"
rusqlite.workspace = true
dirs = "5.0"
chrono.workspace = true
glob = "0.3"
parking_lot.workspace = true
tracing.workspace = true
nix = { workspace = true }

# Encryption
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# OS Keychain. Without a platform feature keyring falls back to an in-memory mock store,
# which keeps nothing past the process. Linux's Secret Service backend needs libdbus.
keyring = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.0"

[package]
name = "colony-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
colony-parser.workspace = true
colony-protocol.workspace = true
colony-exec.workspace = true
colony-cloud-sdk = { workspace = true, optional = true }
colony-memory = { workspace = true, optional = true }
colony-tuple = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Claude SDK - Rust port of Claude Agent SDK
# Published on crates.io: https://crates.io/crates/claude-sdk
claude-sdk = "1.0"

# For streaming and async traits
futures = "0.3"
async-trait = "0.1"

# HTTP client for OpenAI and Ollama
reqwest = { version = "0.12", features = ["json", "stream"] }

[dev-dependencies]
tracing-subscriber.workspace = true

[features]
default = []
cloud = ["colony-cloud-sdk"]
memory = ["colony-memory"]
tuple = ["colony-tuple"]
bedrock = ["claude-sdk/bedrock"]
full = ["cloud", "memory", "tuple", "bedrock"]

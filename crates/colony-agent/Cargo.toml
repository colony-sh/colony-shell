[package]
name = "colony-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
colony-parser.workspace = true
colony-protocol.workspace = true
colony-memory = { workspace = true, optional = true }
colony-tuple = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Claude SDK - our Rust port
# TODO: Update once published to crates.io as "claude-sdk = 1.0"
claude-sdk = { path = "/Users/mcfearsome/src/github.com/mcfearsome/claude-agent-sdk-rust" }

# For streaming and async traits
futures = "0.3"
async-trait = "0.1"

# HTTP client for OpenAI and Ollama
reqwest = { version = "0.12", features = ["json", "stream"] }

[dev-dependencies]
tracing-subscriber.workspace = true

[features]
default = []
memory = ["colony-memory"]
tuple = ["colony-tuple"]
bedrock = ["claude-sdk/bedrock"]
full = ["memory", "tuple", "bedrock"]

[package]
name = "colony-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
colony-parser.workspace = true
colony-expand.workspace = true
colony-tuple = { path = "../colony-tuple" }
colony-channels = { path = "../colony-channels" }
colony-protocol = { path = "../colony-protocol" }
colony-recipe = { path = "../colony-recipe" }
colony-reflection = { path = "../colony-reflection" }
colony-debug = { workspace = true }
colony-secure = { path = "../colony-secure" }
colony-panel = { path = "../colony-panel" }
nix = { workspace = true, features = ["fs"] }
signal-hook.workspace = true
tokio.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
chrono = "0.4"
glob = "0.3"
libc = "0.2"
regex = "1"
serde.workspace = true
serde_json.workspace = true
notify = "6"
toml = "0.8"
dirs.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"

# flux process manager builtin
sysinfo = "0.32"
ratatui = "0.29"
crossterm = "0.28"
listeners = "0.3"
terminal_size = "0.4"

[dev-dependencies]
serial_test = "3.1"
tempfile = "3"

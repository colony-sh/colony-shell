[package]
name = "colony-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "POSIX-compliant shell with AI agent integration, reactive environment, and extended channels"

[[bin]]
name = "colony"
path = "src/main.rs"

[[bin]]
name = "filetree"
path = "../colony-filetree-bin/src/main.rs"

[[bin]]
name = "filedetails"
path = "../colony-filedetails-bin/src/main.rs"

[[bin]]
name = "preview"
path = "../colony-preview-bin/src/main.rs"

[[bin]]
name = "gitstatus"
path = "../colony-gitstatus-bin/src/main.rs"

[[bin]]
name = "gitstage"
path = "../colony-gitstage-bin/src/main.rs"

[[bin]]
name = "jobs-panel"
path = "../colony-jobs-bin/src/main.rs"

[[bin]]
name = "history-panel"
path = "../colony-history-bin/src/main.rs"

[[bin]]
name = "env-panel"
path = "../colony-env-bin/src/main.rs"

[[bin]]
name = "logs-panel"
path = "../colony-logs-bin/src/main.rs"

[[bin]]
name = "session-panel"
path = "../colony-session-bin/src/main.rs"

[dependencies]
colony-parser.workspace = true
colony-expand.workspace = true
colony-exec.workspace = true
colony-protocol.workspace = true
colony-agent = { path = "../colony-agent" }
colony-config = { path = "../colony-config" }
colony-tree-sitter = { path = "../colony-tree-sitter" }
colony-tuple = { path = "../colony-tuple" }
colony-ui-core = { path = "../colony-ui-core" }
colony-secure = { path = "../colony-secure" }
colony-reflection = { path = "../colony-reflection" }
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
miette.workspace = true
regex = "1"
libc = "0.2"
terminal_size = "0.4"

# For REPL
rustyline = "14.0"
nix = { workspace = true }

# For tutorial mode
serde = { workspace = true }
serde_json = { workspace = true }
term_size = "0.3"
thiserror.workspace = true
ratatui = "0.29"
crossterm = "0.28"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
colony-tui = { path = "../colony-tui", optional = true }
colony-panel = { path = "../colony-panel" }
dirs.workspace = true

[features]
default = ["tui"]
tui = ["dep:colony-tui"]

[dev-dependencies]
tempfile = "3"

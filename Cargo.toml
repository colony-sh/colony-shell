[workspace]
resolver = "2"
members = [
    "crates/colony-parser",
    "crates/colony-expand",
    "crates/colony-exec",
    "crates/colony-protocol",
    "crates/colony-agent",
    "crates/colony-channels",
    "crates/colony-config",
    "crates/colony-cloud-sdk",
    "crates/colony-filetree",
    "crates/colony-memory",
    "crates/colony-tuple",
    "crates/colony-mcp",
    "crates/colony-focus",
    "crates/colony-secure",
    "crates/colony-reflection",
    "crates/colony-shell",
    "crates/colony-tree-sitter",
    "crates/colony-tui",
    "crates/colony-ui-core",
    "crates/colony-recipe",
    "crates/colony-panel",
    "crates/colony-filetree-bin",
    "crates/colony-preview-bin",
    "crates/colony-filedetails-bin",
    "crates/colony-jobs-bin",
    "crates/colony-history-bin",
    "crates/colony-gitstatus-bin",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.75"
authors = ["Colony Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcfearsome/colony-shell"
homepage = "https://github.com/mcfearsome/colony-shell"
documentation = "https://docs.rs/colony-shell"
keywords = ["shell", "posix", "ai", "agent", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Unix syscalls
nix = { version = "0.28", features = ["process", "signal", "term", "poll", "user", "hostname", "fs"] }

# Signal handling
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Concurrent collections
scc = "2.0"
parking_lot = "0.12"

# IPC
ipc-channel = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"

# Async utilities
futures = "0.3"

# Errors
thiserror = "1.0"
miette = { version = "7.0", features = ["fancy"] }

# Parser
pest = "2.7"
pest_derive = "2.7"
tree-sitter = "0.20"

# Vector embeddings and storage
lancedb = "0.17"
fastembed = "4"
arrow-array = "53"
arrow-schema = "53"

# Directory utilities
dirs = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
colony-parser = { path = "crates/colony-parser" }
colony-expand = { path = "crates/colony-expand" }
colony-exec = { path = "crates/colony-exec" }
colony-protocol = { path = "crates/colony-protocol" }
colony-agent = { path = "crates/colony-agent" }
colony-channels = { path = "crates/colony-channels" }
colony-config = { path = "crates/colony-config" }
colony-memory = { path = "crates/colony-memory" }
colony-tuple = { path = "crates/colony-tuple" }
colony-mcp = { path = "crates/colony-mcp" }
colony-focus = { path = "crates/colony-focus" }
colony-secure = { path = "crates/colony-secure" }
colony-filetree = { path = "crates/colony-filetree" }
colony-reflection = { path = "crates/colony-reflection" }
colony-tree-sitter = { path = "crates/colony-tree-sitter" }
colony-cloud-sdk = { path = "crates/colony-cloud-sdk" }
colony-ui-core = { path = "crates/colony-ui-core" }
colony-tui = { path = "crates/colony-tui" }
colony-recipe = { path = "crates/colony-recipe" }
colony-panel = { path = "crates/colony-panel" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

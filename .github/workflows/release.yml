name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: colony
  # Debug info for the whole workspace fills the ubuntu runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # ---------------------------------------------------------------------------
  # Gate: run workspace tests before any release build
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - name: Run tests
        run: cargo test --workspace --all-features

  # ---------------------------------------------------------------------------
  # Build matrix: 4 targets in parallel
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest

          - target: x86_64-apple-darwin
            runner: macos-latest

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest

          # Native ARM runner: cross-compiling needs an arm64 libssl for native-tls.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # -- System dependencies ------------------------------------------------

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # -- Rust toolchain -----------------------------------------------------

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ matrix.target }}-

      # -- Build --------------------------------------------------------------

      - name: Build release binary
        run: cargo build --release --bin ${{ env.BINARY_NAME }} --target ${{ matrix.target }}

      # -- Package ------------------------------------------------------------

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="colony-${{ matrix.target }}.tar.gz"
          STAGING="staging-${{ matrix.target }}"

          mkdir -p "${STAGING}"

          # Copy binary
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${STAGING}/"

          # Copy claude-plugin directory
          cp -r claude-plugin/ "${STAGING}/claude-plugin"

          # Create tarball
          tar czf "${ARCHIVE}" -C "${STAGING}" .

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "Packaged ${ARCHIVE}"
          ls -lh "${ARCHIVE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: colony-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 5
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: create GitHub release and upload all tarballs
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect tarballs
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -lh release-assets/

      - name: Generate release notes
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"

          # Find the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v' | sed -n '2p' || true)

          if [ -n "${PREV_TAG}" ]; then
            echo "Generating notes from ${PREV_TAG} to ${TAG}"
            NOTES=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "No previous tag found, using all commits"
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          fi

          # Write to file for the release action (no expression interpolation)
          {
            echo "## What's Changed"
            echo ""
            echo "${NOTES}"
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "# macOS (Apple Silicon)"
            echo "curl -fsSL https://github.com/colony-sh/colony-shell/releases/download/${TAG}/colony-aarch64-apple-darwin.tar.gz | tar xz"
            echo ""
            echo "# macOS (Intel)"
            echo "curl -fsSL https://github.com/colony-sh/colony-shell/releases/download/${TAG}/colony-x86_64-apple-darwin.tar.gz | tar xz"
            echo ""
            echo "# Linux (x86_64)"
            echo "curl -fsSL https://github.com/colony-sh/colony-shell/releases/download/${TAG}/colony-x86_64-unknown-linux-gnu.tar.gz | tar xz"
            echo ""
            echo "# Linux (ARM64)"
            echo "curl -fsSL https://github.com/colony-sh/colony-shell/releases/download/${TAG}/colony-aarch64-unknown-linux-gnu.tar.gz | tar xz"
            echo '```'
            echo ""
            echo "Or install via Homebrew:"
            echo ""
            echo '```bash'
            echo "brew install colony-sh/tap/colony"
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Homebrew: update the tap formula with new version and SHA256 hashes
  # ---------------------------------------------------------------------------
  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Compute SHA256 hashes
        id: hashes
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            TARBALL=$(find artifacts -name "*${target}.tar.gz" | head -1)
            if [ -z "${TARBALL}" ]; then
              echo "ERROR: tarball not found for ${target}"
              exit 1
            fi
            SHA=$(sha256sum "${TARBALL}" | awk '{print $1}')
            # Convert target to env-friendly name: aarch64-apple-darwin -> aarch64_apple_darwin
            ENV_NAME=$(echo "${target}" | tr '-' '_')
            echo "sha256_${ENV_NAME}=${SHA}" >> "$GITHUB_OUTPUT"
            echo "${target}: ${SHA}"
          done

      - name: Clone homebrew-tap
        run: |
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/colony-sh/homebrew-tap.git" homebrew-tap

      - name: Generate formula
        run: |
          set -euo pipefail

          VERSION="${{ steps.hashes.outputs.version }}"
          TAG="${{ steps.hashes.outputs.tag }}"
          SHA_AARCH64_DARWIN="${{ steps.hashes.outputs.sha256_aarch64_apple_darwin }}"
          SHA_X86_64_DARWIN="${{ steps.hashes.outputs.sha256_x86_64_apple_darwin }}"
          SHA_X86_64_LINUX="${{ steps.hashes.outputs.sha256_x86_64_unknown_linux_gnu }}"
          SHA_AARCH64_LINUX="${{ steps.hashes.outputs.sha256_aarch64_unknown_linux_gnu }}"
          BASE_URL="https://github.com/colony-sh/colony-shell/releases/download/${TAG}"

          mkdir -p homebrew-tap/Formula

          cat > homebrew-tap/Formula/colony.rb << 'RUBY_EOF'
          class Colony < Formula
            desc "POSIX-compatible shell with AI agent integration, reactive environment, and extended channels"
            homepage "https://colony.sh"
            license "MIT"
          RUBY_EOF

          # Append platform blocks with interpolated values
          cat >> homebrew-tap/Formula/colony.rb << RUBY_EOF

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/colony-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_DARWIN}"
              else
                url "${BASE_URL}/colony-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_DARWIN}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/colony-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_AARCH64_LINUX}"
              else
                url "${BASE_URL}/colony-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_64_LINUX}"
              end
            end

            def install
              bin.install "colony"

              # Install Claude Code plugin
              if Dir.exist?("claude-plugin")
                (share/"colony/claude-plugin").install Dir["claude-plugin/*"]
              end
            end

            def caveats
              <<~EOS
                Colony Shell has been installed.

                To use as your login shell, add it to /etc/shells:
                  echo "#{HOMEBREW_PREFIX}/bin/colony" | sudo tee -a /etc/shells

                Then change your shell:
                  chsh -s #{HOMEBREW_PREFIX}/bin/colony

                The Claude Code plugin has been installed to:
                  #{share}/colony/claude-plugin
              EOS
            end

            test do
              assert_match "colony", shell_output("#{bin}/colony --version")
            end
          end
          RUBY_EOF

          # Strip leading whitespace from heredoc indentation
          sed -i 's/^          //' homebrew-tap/Formula/colony.rb

          echo "Generated formula:"
          cat homebrew-tap/Formula/colony.rb

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "colony-release-bot"
          git config user.email "release-bot@colony.sh"
          git add Formula/colony.rb
          git commit -m "colony ${{ steps.hashes.outputs.tag }}: update to ${{ steps.hashes.outputs.version }}"
          git push origin main
